<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | evolve studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0c0e14;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 24px;
      padding: 48px 36px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .login-logo span { font-weight: 400; color: #9ca3b4; }

    .login-title {
      text-align: center;
      font-size: 0.9rem;
      color: #9ca3b4;
      margin-bottom: 36px;
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      display: none;
    }

    .error-msg.show { display: block; }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #f0f0f5;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      color: #f0f0f5;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.3s;
    }

    input::placeholder { color: #5c6478; }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: #f0f0f5;
      color: #0c0e14;
      border: none;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #5c6478;
      text-decoration: none;
      transition: color 0.3s;
    }

    .back-link:hover { color: #9ca3b4; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">evolve <span>studio</span></div>
    <p class="login-title">Admin Panel</p>

    <div class="error-msg" id="error-msg">Invalid username or password.</div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-login">Sign in</button>
    </form>

    <a href="/" class="back-link">Back to website</a>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      errorMsg.classList.remove('show');

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          window.location.href = '/admin/dashboard';
        } else {
          errorMsg.classList.add('show');
        }
      } catch {
        errorMsg.classList.add('show');
      }
    });
  </script>
</body>
</html>
